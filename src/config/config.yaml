# src/config/config.yaml (canonical config for src package)

data:
  default_league_id: 47
  fbref_league: "ENG-Premier League"
  seasons:
    - "2024/2025"
    - "2025/2026"

  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"

ratings:
  home_field_advantage: true
  rating_window: 8

form:
  points_window: 5
  goals_window: 5

xg:
  xg_for_window: 8
  xg_against_window: 8

injury:
  positional_weights:
    goalkeeper: 1.4
    centre_back: 1.3
    full_back: 1.1
    defensive_mid: 1.2
    central_mid: 1.2
    winger: 1.0
    striker: 1.1
  injury_decay: 0.7
  min_absence_matches: 3

monte_carlo:
  num_trials: 10000
  random_seed: 42

ml:
  xgboost:
    max_depth: 4
    learning_rate: 0.05
    n_estimators: 300
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
  ensemble_weights:
    poisson_mc: 0.5
    xgboost: 0.5

evaluation:
  target_brier_score: 0.20
  initial_train_size: 200
  step_size: 38

ingestion:
  soccerdata:
    league: "ENG-Premier League"
    no_cache: false
    no_store: false
    headless: true
